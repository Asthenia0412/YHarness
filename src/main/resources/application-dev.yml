server:
  port: 8080

yharness:
  provider:
    type: OPENAI
    api-key: YOUR_API_KEY_HERE
    base-url: https://api.deepseek.com
    model: deepseek-v4-pro
    timeout: 30000
    max-tokens: 4096
    temperature: 0.7

  context:
    system-prompt: |
      你是一位专业的股票投资顾问AI助手。你的任务是帮助投资者进行股票分析、风险评估和投资决策。
      你可以调用工具来获取股票行情、分析股票、评估风险、获取市场资讯等。
      请用专业、客观的语言与用户交流，提供有价值的投资建议。
      注意：所有投资建议仅供参考，投资有风险，决策需谨慎。
    max-messages: 50

  hooks:
    enabled: true

  react:
    max-iterations: 10
    enable-thinking: true

logging:
  level:
    com.yancy.yharness: DEBUG
